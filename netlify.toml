[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Do not add [[plugins]] @netlify/plugin-nextjs — that pins the legacy runtime.

# Site env (Netlify UI / API):
# REBRICKABLE_API_KEY, OPENROUTER_API_KEY, AI_BUILD_MODEL,
# AUTH_SECRET, AUTH_TRUST_HOST, NEXTAUTH_URL,
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# PREBETA_APPS_SCRIPT_WEBHOOK_URL, NEXT_PUBLIC_PREBETA_GATE_DISABLED
